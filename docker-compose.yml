services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-predictepl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-predictepl}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U predictepl"]
      interval: 5s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.0-full
    profiles: [tracking]
    restart: unless-stopped
    command: ["sh", "-c", "pip install psycopg2-binary==2.9.10 -q && exec mlflow server --backend-store-uri \"$$MLFLOW_BACKEND_STORE_URI\" --default-artifact-root /mlflow/artifacts --host 0.0.0.0 --port 5000"]
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER:-predictepl}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/mlflow
    depends_on:
      mlflow-db-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-predictepl}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-predictepl}
      FOOTBALL_DATA_API_KEY: ${FOOTBALL_DATA_API_KEY}
      MLFLOW_TRACKING_URI: ""
    depends_on:
      db:
        condition: service_healthy

  mlflow-db-init:
    image: postgres:16-alpine
    profiles: [tracking]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGUSER: ${POSTGRES_USER:-predictepl}
      PGHOST: db
      PGDATABASE: postgres
    entrypoint: ["sh", "-c", "psql -v ON_ERROR_STOP=1 -tc \"SELECT 1 FROM pg_database WHERE datname = 'mlflow'\" | grep -q 1 || createdb mlflow"]
    restart: "no"

volumes:
  postgres_data:
  mlflow_artifacts:
